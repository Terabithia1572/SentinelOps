services:
  sentinelops-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: sentinelops-api
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sentinelops;Username=sentinelops;Password=${POSTGRES_PASSWORD:-SentinelOps_Dev_2026!}
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET_KEY:-SentinelOps-Development-Secret-Key-Min-32-Characters-Long!!}
      - JwtSettings__Issuer=SentinelOps
      - JwtSettings__Audience=SentinelOps
      - JwtSettings__ExpirationMinutes=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - sentinelops
    restart: unless-stopped

  sentinelops-worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: sentinelops-worker
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sentinelops;Username=sentinelops;Password=${POSTGRES_PASSWORD:-SentinelOps_Dev_2026!}
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - sentinelops
    restart: unless-stopped

  sentinelops-web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: sentinelops-web
    ports:
      - "3000:80"
    depends_on:
      sentinelops-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - sentinelops
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: sentinelops-postgres
    environment:
      POSTGRES_DB: sentinelops
      POSTGRES_USER: sentinelops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SentinelOps_Dev_2026!}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelops -d sentinelops"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - sentinelops
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentinelops-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60 1", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - sentinelops
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: sentinelops-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - SENTINELOPS_API_KEY=${SENTINELOPS_COLLECTOR_API_KEY:-sent_live_collector_internal_key}
    volumes:
      - ./deploy/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics (collector)
      - "8889:8889"   # Prometheus exporter
    depends_on:
      sentinelops-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - sentinelops
    restart: unless-stopped

volumes:
  postgres_data:
    name: sentinelops_postgres_data
  redis_data:
    name: sentinelops_redis_data

networks:
  sentinelops:
    name: sentinelops_sentinelops
    driver: bridge

