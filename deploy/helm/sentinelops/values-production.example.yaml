# SentinelOps Helm Values — Production Reference Architecture Profile
# NOTE: Secrets must be injected via external Secret Provider (e.g. Vault, AWS Secrets Manager)
environment: "Production"

api:
  replicaCount: 3
  image:
    repository: "ghcr.io/terabithia1572/sentinelops-api"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 2

worker:
  replicaCount: 3
  image:
    repository: "ghcr.io/terabithia1572/sentinelops-worker"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1500m
      memory: 1536Mi
    requests:
      cpu: 300m
      memory: 512Mi
  pdb:
    enabled: true
    minAvailable: 2

web:
  replicaCount: 3
  image:
    repository: "ghcr.io/terabithia1572/sentinelops-web"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  pdb:
    enabled: true
    minAvailable: 2

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sentinelops-api"
  hosts:
    - host: sentinelops.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /hubs
          pathType: Prefix
          service: api
        - path: /v1
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: sentinelops-tls-production
      hosts:
        - sentinelops.example.com

# External Production Databases (Managed RDS/Cloud SQL & Redis Cluster)
postgresql:
  host: "postgres-primary.production.database.internal"
  port: 5432
  database: "sentinelops_production"
  user: "sentinelops_app"
  existingSecret: "sentinelops-prod-db-credentials"
  secretKey: "password"

redis:
  host: "redis-cluster.production.cache.internal"
  port: 6379
  existingSecret: "sentinelops-prod-redis-credentials"
  secretKey: "password"
  standalone:
    enabled: false # Use external HA Redis cluster in production

jwt:
  existingSecret: "sentinelops-prod-jwt-secret"
  secretKey: "signing-key"
  issuer: "https://sentinelops.example.com"
  audience: "https://sentinelops.example.com"
  expirationMinutes: 60

networkPolicy:
  enabled: true
