# SentinelOps Helm Values — Staging Reference Architecture Profile
# NOTE: Real staging secrets must be provisioned via an external secret manager or Kubernetes Secret.
environment: "Staging"

global:
  domain: "staging.sentinelops.local"

api:
  replicaCount: 2
  image:
    repository: "ghcr.io/terabithia1572/sentinelops-api"
    tag: "staging"
    pullPolicy: Always
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1

worker:
  replicaCount: 2
  image:
    repository: "ghcr.io/terabithia1572/sentinelops-worker"
    tag: "staging"
    pullPolicy: Always
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi
  pdb:
    enabled: true
    minAvailable: 1

web:
  replicaCount: 2
  image:
    repository: "ghcr.io/terabithia1572/sentinelops-web"
    tag: "staging"
    pullPolicy: Always
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 32Mi
  pdb:
    enabled: true
    minAvailable: 1

collector:
  replicaCount: 1
  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.120.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

migrationJob:
  enabled: true
  backoffLimit: 2
  image:
    repository: "ghcr.io/terabithia1572/sentinelops-api"
    tag: "staging"
    pullPolicy: Always

postgresql:
  host: "postgres-staging.sentinelops.internal"
  port: 5432
  database: "sentinelops_staging"
  username: "sentinelops_app"
  existingSecret: "sentinelops-staging-secrets"
  secretKey: "database-password"

redis:
  host: "redis-staging.sentinelops.internal"
  port: 6379
  existingSecret: "sentinelops-staging-secrets"
  secretKey: "redis-password"

jwt:
  issuer: "SentinelOpsStaging"
  audience: "SentinelOpsStagingUsers"
  expirationMinutes: 30
  existingSecret: "sentinelops-staging-secrets"
  secretKey: "jwt-signing-key"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: "staging.sentinelops.local"
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: "api.staging.sentinelops.local"
      paths:
        - path: /
          pathType: Prefix
          service: api
  tls:
    - secretName: sentinelops-staging-tls
      hosts:
        - "staging.sentinelops.local"
        - "api.staging.sentinelops.local"

networkPolicy:
  enabled: true
