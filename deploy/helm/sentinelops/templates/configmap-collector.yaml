{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinelops.fullname" . }}-collector-config
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 500ms
        send_batch_size: 256

    exporters:
      otlphttp:
        traces_endpoint: "http://{{ include "sentinelops.fullname" . }}-api:8080/v1/traces"
        metrics_endpoint: "http://{{ include "sentinelops.fullname" . }}-api:8080/v1/metrics"
        logs_endpoint: "http://{{ include "sentinelops.fullname" . }}-api:8080/v1/logs"
        encoding: json

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp]
{{- end }}
