{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinelops.fullname" . }}-collector
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  type: {{ .Values.otelCollector.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.otelCollector.service.ports.grpc }}
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
    - port: {{ .Values.otelCollector.service.ports.http }}
      targetPort: otlp-http
      protocol: TCP
      name: otlp-http
      {{- if and (eq (.Values.otelCollector.service.type | default "ClusterIP") "NodePort") .Values.otelCollector.service.nodePort }}
      nodePort: {{ .Values.otelCollector.service.nodePort }}
      {{- end }}
  selector:
    {{- include "sentinelops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
{{- end }}
