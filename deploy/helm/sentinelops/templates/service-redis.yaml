{{- if and .Values.redis.standalone.enabled (eq .Values.redis.host "redis") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinelops.fullname" . }}-redis
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "sentinelops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
