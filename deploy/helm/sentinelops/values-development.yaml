# SentinelOps Helm Values — Development Environment Profile
environment: "Development"

api:
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
  pdb:
    enabled: false

worker:
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  pdb:
    enabled: false

web:
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: sentinelops.dev.local
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /hubs
          pathType: Prefix
          service: api
        - path: /v1
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
  tls: []

networkPolicy:
  enabled: false
