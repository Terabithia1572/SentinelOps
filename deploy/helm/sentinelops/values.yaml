# Default values for SentinelOps Helm Chart
nameOverride: ""
fullnameOverride: ""

environment: "Production"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# API Component (ASP.NET Core Web API & SignalR)
api:
  replicaCount: 2
  image:
    repository: sentinelops-api
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 1500m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /health/live
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 3
    failureThreshold: 10

# Worker Component (Background Stream Processing & Alert Evaluation)
worker:
  replicaCount: 2
  image:
    repository: sentinelops-worker
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: false
  pdb:
    enabled: true
    minAvailable: 1

# Web Frontend Component (React 19 / Nginx Static Serve)
web:
  replicaCount: 2
  image:
    repository: sentinelops-web
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  autoscaling:
    enabled: false
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10

# OpenTelemetry Collector Component
otelCollector:
  enabled: true
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    pullPolicy: IfNotPresent
    tag: "0.120.0"
  service:
    ports:
      grpc: 4317
      http: 4318
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sentinelops-api"
  hosts:
    - host: sentinelops.local
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /hubs
          pathType: Prefix
          service: api
        - path: /v1
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
  tls: []

# Database Migrations Job
migrationJob:
  enabled: true
  image:
    repository: sentinelops-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  backoffLimit: 3

# Network Policy
networkPolicy:
  enabled: true

# External / Internal Storage Settings
postgresql:
  host: "postgres"
  port: 5432
  database: "sentinelops"
  user: "sentinelops_app"
  existingSecret: "sentinelops-db-secret"
  secretKey: "password"

redis:
  host: "redis"
  port: 6379
  existingSecret: "sentinelops-redis-secret"
  secretKey: "password"
  standalone:
    enabled: true
    storageSize: 2Gi

jwt:
  existingSecret: "sentinelops-jwt-secret"
  secretKey: "signing-key"
  issuer: "https://sentinelops.local"
  audience: "https://sentinelops.local"
  expirationMinutes: 60
