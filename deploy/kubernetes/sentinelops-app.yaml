apiVersion: v1
kind: Namespace
metadata:
  name: sentinelops
  labels:
    app.kubernetes.io/name: sentinelops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinelops-sa
  namespace: sentinelops
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelops-config
  namespace: sentinelops
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "sentinelops"
  POSTGRES_USER: "sentinelops_app"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  JwtSettings__Issuer: "https://sentinelops.local"
  JwtSettings__Audience: "https://sentinelops.local"
  JwtSettings__ExpirationMinutes: "60"
  SignalR__UseRedisBackplane: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://sentinelops-collector:4318"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelops-api
  namespace: sentinelops
  labels:
    app.kubernetes.io/name: sentinelops
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelops
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelops
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: sentinelops-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: sentinelops-api:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sentinelops-config
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=placeholder_secret_at_runtime;Maximum Pool Size=50;Minimum Pool Size=5;Connection Idle Lifetime=60;"
            - name: ConnectionStrings__Redis
              value: "$(REDIS_HOST):$(REDIS_PORT),abortConnect=false,connectTimeout=5000"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: 1500m
              memory: 1024Mi
            requests:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelops-api
  namespace: sentinelops
  labels:
    app.kubernetes.io/name: sentinelops
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: sentinelops
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelops-worker
  namespace: sentinelops
  labels:
    app.kubernetes.io/name: sentinelops
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelops
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelops
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: sentinelops-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: sentinelops-worker:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: sentinelops-config
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=placeholder_secret_at_runtime;Maximum Pool Size=50;Minimum Pool Size=5;Connection Idle Lifetime=60;"
            - name: ConnectionStrings__Redis
              value: "$(REDIS_HOST):$(REDIS_PORT),abortConnect=false,connectTimeout=5000"
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 200m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelops-web
  namespace: sentinelops
  labels:
    app.kubernetes.io/name: sentinelops
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelops
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelops
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: sentinelops-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: web
          image: sentinelops-web:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelops-web
  namespace: sentinelops
  labels:
    app.kubernetes.io/name: sentinelops
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: sentinelops
    app.kubernetes.io/component: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelops-ingress
  namespace: sentinelops
  labels:
    app.kubernetes.io/name: sentinelops
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sentinelops-api"
spec:
  ingressClassName: nginx
  rules:
    - host: sentinelops.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sentinelops-api
                port:
                  number: 8080
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: sentinelops-api
                port:
                  number: 8080
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: sentinelops-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinelops-web
                port:
                  number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinelops-api-pdb
  namespace: sentinelops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelops
      app.kubernetes.io/component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinelops-api-hpa
  namespace: sentinelops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinelops-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
